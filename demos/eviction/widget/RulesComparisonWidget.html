<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rules Comparison Widget</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #F7F9FC; font-family: 'Segoe UI', Calibri, sans-serif; }
  @media (max-width: 700px) {
    .panels { grid-template-columns: 1fr !important; }
  }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState } = React;

const JURISDICTIONS = ["CA", "TX", "NY"];

const FACT_PATTERNS = {
  CA: { state: "California", city: "Los Angeles", noticeType: "3-Day Pay or Quit", amount: "$1,850 rent + $200 late fees ($2,050 total)", tenancy: "3 years", servedBy: "Post and mail (nail and mail)" },
  TX: { state: "Texas", city: "Houston", noticeType: "3-Day Notice to Vacate", amount: "$1,850 rent + $200 late fees ($2,050 total)", tenancy: "3 years", servedBy: "Posted on door" },
  NY: { state: "New York", city: "New York City", noticeType: "3-Day Rent Demand", amount: "$1,850 rent + $200 late fees ($2,050 total)", tenancy: "3 years", servedBy: "Personal delivery" },
};

const LLM_RESPONSES = {
  CA: { text: `California Code of Civil Procedure §1161(2) was retrieved live. It requires a 3-Day Notice to Pay Rent or Quit when a tenant defaults on rent, with written notice stating "the amount that is due."\n\nThe notice period of 3 days appears consistent with the statute. The notice was served by nail-and-mail, a recognized service method under CCP §1162.\n\nThe total amount demanded is $2,050.\n\nNo procedural defects identified. Recommendation: Pay the amount demanded or vacate within 3 days.`, defectsFound: 0, badge: "AI + live statute retrieval / no rules file" },
  TX: { text: `Texas Property Code §24.005 was retrieved live. It requires a minimum 3-day notice to vacate before an eviction suit may be filed for nonpayment or lease violation.\n\nThe notice period of 3 days is consistent with the statutory minimum. The notice was posted on the door, a recognized delivery method.\n\nThe amount demanded is $2,050.\n\nNo procedural defects identified. Recommendation: Pay the amount demanded or vacate within 3 days.`, defectsFound: 0, badge: "AI + live statute retrieval / no rules file" },
  NY: { text: `New York RPAPL §711(2) was retrieved live. It requires a written rent demand before a nonpayment proceeding may be commenced.\n\nThe notice was served by personal delivery. The total amount demanded is $2,050.\n\nNo procedural defects identified. Recommendation: Pay the demanded amount or vacate to avoid eviction proceedings.`, defectsFound: 0, badge: "AI + live statute retrieval / no rules file" },
};

const RULES_RESPONSES = {
  CA: {
    rulesFile: "ca_eviction_v1.json (DRAFT)",
    defects: [
      { id: "CA-DEFECT-01", title: "Late fees included in notice amount", detail: "California law (CCP §1161(2)) prohibits including late fees in a Pay or Quit notice. Only unpaid rent may be demanded. The $200 late fee renders this notice void.", statute: "CCP §1161(2)", severity: "INVALID" },
      { id: "CA-DEFECT-02", title: "Incorrect notice period for tenancy length", detail: "For a tenancy of 3 years, California requires a 15-day Pay or Quit notice (not 3 days) under AB 1482. ⚠ Attorney validation required on 15-day period.", statute: "CCP §1161(2); AB 1482", severity: "INVALID" },
    ],
    defenses: ["Habitability (uninhabitable conditions)", "Retaliatory eviction", "LA RSO just-cause requirement (LAMC 151.09)"],
    localOverlay: "Los Angeles RSO applies to pre-1978 multi-unit buildings — additional just-cause protections may apply.",
    nextStep: "Contact a legal aid attorney immediately. This notice may be void.",
    statusBadge: "Grounded in rules file ca_eviction_v1.json",
  },
  TX: {
    rulesFile: "tx_eviction_v1.json (DRAFT)",
    defects: [
      { id: "TX-DEFECT-01", title: "CARES Act check required", detail: "If this property has a federally backed mortgage or receives HUD/Section 8 assistance, a 30-day notice is required under the CARES Act (§4024), not 3 days. Verify property status.", statute: "CARES Act §4024", severity: "POTENTIALLY_INVALID" },
    ],
    defenses: ["Habitability", "Retaliatory eviction", "Discrimination"],
    localOverlay: "Texas has no statewide just-cause requirement. No statewide rent control. Note: Texas analysis is shorter — simpler law, different rules file.",
    nextStep: "Verify whether property has federally backed mortgage. Contact Texas legal aid immediately.",
    statusBadge: "Grounded in rules file tx_eviction_v1.json",
  },
  NY: {
    rulesFile: "ny_eviction_v1.json (DRAFT)",
    defects: [
      { id: "NY-DEFECT-01", title: "Incorrect notice period — NY requires 14 days", detail: "New York law (RPAPL §711(2), amended by HSTPA 2019) requires a 14-day notice for nonpayment — not 3 days. A 3-day notice in New York is legally defective.", statute: "RPAPL §711(2); HSTPA 2019", severity: "INVALID" },
    ],
    defenses: ["Habitability (RPL §235-b)", "Retaliatory eviction (RPL §223-b)", "NYC rent stabilization (if applicable)", "Good Cause Eviction Law (2024)"],
    localOverlay: "If unit is in NYC: check rent stabilization status. Good Cause Eviction Law (2024) may require stated reason for termination.",
    nextStep: "This notice is defective in New York. Contact NYC legal aid immediately — do not vacate.",
    statusBadge: "Grounded in rules file ny_eviction_rules_v0.1.json",
  },
};

const RULES_SNIPPETS = {
  CA: `"notice_defects": [\n  {\n    "defect": "includes_late_fees",\n    "result": "INVALID",\n    "statute": "CCP §1161(2)",\n    "note": "Any amount other than unpaid rent renders notice void"\n  },\n  {\n    "defect": "incorrect_period_over_1yr",\n    "result": "INVALID",\n    "note": "15-day minimum for tenancies 12+ months (AB 1482)"\n  }\n]`,
  TX: `"notice_defects": [\n  {\n    "defect": "cares_act_noncompliance",\n    "result": "POTENTIALLY_INVALID",\n    "note": "30-day notice required for federally backed properties"\n  }\n],\n"just_cause_required": false,\n"statewide_rent_control": false`,
  NY: `"notice_defects": [\n  {\n    "defect": "insufficient_notice_period",\n    "result": "INVALID",\n    "statute": "RPAPL §711(2)",\n    "note": "NY requires 14-day notice (HSTPA 2019), not 3 days"\n  }\n]`,
};

const sevColor = s => s === "INVALID" ? "#dc2626" : s === "POTENTIALLY_INVALID" ? "#d97706" : "#16a34a";

function Widget() {
  const [j, setJ] = useState("CA");
  const [showWhy, setShowWhy] = useState(false);
  const [showSnippet, setShowSnippet] = useState(false);

  const facts = FACT_PATTERNS[j];
  const llm = LLM_RESPONSES[j];
  const rules = RULES_RESPONSES[j];
  const snippet = RULES_SNIPPETS[j];

  return (
    <div style={{maxWidth:1100,margin:"0 auto",padding:16}}>
      <div style={{textAlign:"center",marginBottom:20}}>
        <h2 style={{fontSize:22,fontWeight:"bold",color:"#0D2137",margin:"0 0 6px"}}>Rules File vs. Raw AI: The Difference That Matters</h2>
        <p style={{fontSize:13,color:"#4A5568",margin:0}}>Same tenant. Same notice. Two very different answers.</p>
      </div>

      <div style={{display:"flex",justifyContent:"center",gap:10,marginBottom:18,alignItems:"center"}}>
        <span style={{fontSize:13,color:"#4A5568"}}>Jurisdiction:</span>
        {JURISDICTIONS.map(jj => (
          <button key={jj} onClick={() => setJ(jj)} style={{padding:"6px 20px",borderRadius:6,border:`2px solid ${j===jj?"#1B5E8C":"#CBD5E0"}`,background:j===jj?"#1B5E8C":"#fff",color:j===jj?"#fff":"#4A5568",fontWeight:j===jj?"bold":"normal",fontSize:14,cursor:"pointer"}}>
            {jj}
          </button>
        ))}
      </div>

      <div style={{background:"#F0F4F8",border:"1px solid #CBD5E0",borderRadius:8,padding:"10px 16px",marginBottom:16,fontSize:12.5,color:"#4A5568"}}>
        <strong style={{color:"#1A1A2E",marginRight:6}}>Fact Pattern:</strong>
        Maria Garcia · {facts.city}, {facts.state} · {facts.noticeType} · {facts.amount} · Tenancy: {facts.tenancy} · Served by: {facts.servedBy}
      </div>

      <div className="panels" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>

        {/* LEFT */}
        <div style={{border:"2px solid #FCA5A5",borderRadius:10,overflow:"hidden"}}>
          <div style={{background:"#FEF2F2",borderBottom:"2px solid #FCA5A5",padding:"10px 14px",display:"flex",alignItems:"center",gap:8}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:"bold",fontSize:14,color:"#991B1B"}}>⚠ Without Rules File</div>
              <div style={{fontSize:11,color:"#B91C1C"}}>AI + live statute retrieval — no structured decision logic</div>
            </div>
            <div style={{background:"#FEE2E2",border:"1px solid #FCA5A5",borderRadius:12,padding:"2px 10px",fontSize:10,color:"#991B1B",fontWeight:"bold",whiteSpace:"nowrap"}}>
              DEFECTS FOUND: {llm.defectsFound}
            </div>
          </div>
          <div style={{padding:16}}>
            <div style={{background:"#fff7f7",border:"1px solid #FED7D7",borderRadius:6,padding:14,fontSize:12.5,color:"#1A1A2E",lineHeight:1.75,whiteSpace:"pre-line",minHeight:180}}>
              {llm.text}
            </div>
            <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:5}}>
              <div style={{fontSize:11.5,color:"#B91C1C"}}>✗ Sources cited: None</div>
              <div style={{fontSize:11.5,color:"#B91C1C"}}>✗ Rules file: Not used</div>
              <div style={{background:"#FEE2E2",border:"1px solid #FCA5A5",borderRadius:6,padding:"6px 10px",fontSize:11,color:"#991B1B",marginTop:4}}>
                ⚠ {llm.badge}
              </div>
            </div>
          </div>
        </div>

        {/* RIGHT */}
        <div style={{border:"2px solid #86EFAC",borderRadius:10,overflow:"hidden"}}>
          <div style={{background:"#F0FDF4",borderBottom:"2px solid #86EFAC",padding:"10px 14px",display:"flex",alignItems:"center",gap:8}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:"bold",fontSize:14,color:"#14532D"}}>✓ With Rules File</div>
              <div style={{fontSize:11,color:"#15803D"}}>Deterministic · Cited · Auditable</div>
            </div>
            <div style={{background:"#DCFCE7",border:"1px solid #86EFAC",borderRadius:12,padding:"2px 10px",fontSize:10,color:"#14532D",fontWeight:"bold",whiteSpace:"nowrap"}}>
              DEFECTS FOUND: {rules.defects.length}
            </div>
          </div>
          <div style={{padding:16}}>
            <div style={{fontSize:11,fontWeight:"bold",color:"#4A5568",marginBottom:8,letterSpacing:0.5}}>
              NOTICE ANALYSIS — {facts.state} Eviction Notice Validator · {rules.rulesFile}
            </div>
            {rules.defects.map(d => (
              <div key={d.id} style={{background:"#FFF7ED",border:`1px solid ${sevColor(d.severity)}`,borderLeft:`4px solid ${sevColor(d.severity)}`,borderRadius:6,padding:"10px 12px",marginBottom:10}}>
                <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                  <span style={{background:sevColor(d.severity),color:"#fff",borderRadius:4,padding:"1px 7px",fontSize:10,fontWeight:"bold",whiteSpace:"nowrap",marginTop:2}}>{d.severity}</span>
                  <div>
                    <div style={{fontWeight:"bold",fontSize:12.5,color:"#1A1A2E",marginBottom:3}}>{d.title}</div>
                    <div style={{fontSize:12,color:"#4A5568",lineHeight:1.5}}>{d.detail}</div>
                    <div style={{fontSize:11,color:"#1B5E8C",fontWeight:"bold",marginTop:4}}>Statute: {d.statute}</div>
                  </div>
                </div>
              </div>
            ))}
            <div style={{marginTop:8}}>
              <div style={{fontSize:11,fontWeight:"bold",color:"#4A5568",marginBottom:5}}>DEFENSES TO INVESTIGATE:</div>
              {rules.defenses.map((d,i) => <div key={i} style={{fontSize:12,color:"#4A5568",marginBottom:3}}>• {d}</div>)}
            </div>
            <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:6,padding:"8px 12px",marginTop:10,fontSize:12,color:"#1e40af"}}>
              <strong>Local overlay:</strong> {rules.localOverlay}
            </div>
            <div style={{background:"#0D2137",color:"#fff",borderRadius:6,padding:"10px 14px",marginTop:12,fontSize:12.5,fontWeight:"bold"}}>
              Next step: {rules.nextStep}
            </div>
            <div style={{marginTop:10,fontSize:11.5,color:"#15803D"}}>✓ {rules.statusBadge}</div>
            <div style={{fontSize:10.5,color:"#6B7280",fontStyle:"italic",marginTop:4}}>⚠ This is legal information, not legal advice. Verify with a licensed attorney.</div>
          </div>
        </div>
      </div>

      {/* Why toggle */}
      <div style={{marginTop:16,border:"1px solid #CBD5E0",borderRadius:8,overflow:"hidden"}}>
        <button onClick={() => setShowWhy(!showWhy)} style={{width:"100%",background:"#F7F9FC",border:"none",padding:"12px 16px",display:"flex",justifyContent:"space-between",cursor:"pointer",fontSize:13,fontWeight:"bold",color:"#1B5E8C"}}>
          <span>Why the difference?</span><span>{showWhy ? "▲" : "▼"}</span>
        </button>
        {showWhy && (
          <div style={{padding:"14px 18px",background:"#fff",fontSize:13,color:"#4A5568",lineHeight:1.75,borderTop:"1px solid #E2E8F0"}}>
            <p style={{margin:"0 0 10px"}}><strong style={{color:"#1A1A2E"}}>The left panel is not broken — it's a capable AI doing its best with what it has.</strong> The problem is that it's answering from training data that may be months or years old, with no way to verify whether the law changed or to cite a specific source. It produces a confident-sounding answer that is wrong — and that error has real consequences for a real person.</p>
            <p style={{margin:0}}><strong style={{color:"#1A1A2E"}}>The right panel uses the same underlying AI model.</strong> The difference is the rules file: a structured data file that encodes eviction notice law as explicit if/then logic. The AI reads the rules file and applies it deterministically — no guessing, no hallucination. The result is auditable, citable, and updateable. <strong>Building and validating this library across 50 states is the the first major community project.</strong></p>
          </div>
        )}
      </div>

      {/* Snippet toggle */}
      <div style={{marginTop:10,border:"1px solid #CBD5E0",borderRadius:8,overflow:"hidden"}}>
        <button onClick={() => setShowSnippet(!showSnippet)} style={{width:"100%",background:"#F7F9FC",border:"none",padding:"12px 16px",display:"flex",justifyContent:"space-between",cursor:"pointer",fontSize:13,fontWeight:"bold",color:"#0E7C87"}}>
          <span>See the rules file that powered this ({j === "CA" ? "ca_eviction_v1.json" : j === "TX" ? "tx_eviction_v1.json" : "ny_eviction_v1.json"}) — notice_defects section</span>
          <span>{showSnippet ? "▲" : "▼"}</span>
        </button>
        {showSnippet && (
          <div style={{borderTop:"1px solid #E2E8F0"}}>
            <div style={{background:"#0A1520",padding:"14px 18px",fontFamily:"'Consolas','Monaco',monospace",fontSize:12,color:"#7EC8A0",lineHeight:1.8,whiteSpace:"pre"}}>
              {snippet}
            </div>
            <div style={{background:"#F0F4F8",padding:"8px 16px",fontSize:11,color:"#6B7280",borderTop:"1px solid #E2E8F0"}}>
              DRAFT — AI-generated, not attorney-validated. Full file in GitHub repo: rules/eviction/
            </div>
          </div>
        )}
      </div>

      <div style={{textAlign:"center",marginTop:18,fontSize:11,color:"#9AA5B4"}}>
         Eviction Defense Demo · v0.1 · DRAFT · This is legal information, not legal advice. Not for production use with real clients.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Widget />);
</script>
</body>
</html>
